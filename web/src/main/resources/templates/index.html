<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Home'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="alert alert-danger" id="error-message" role="alert" style="display: none;">
        <div class="message"></div>
        <pre class="details"></pre>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
    <script data-th-src="@{/js/web-eid.min.js}"></script>
    <script data-th-src="@{/js/web-eid-errors.js}"></script>
    <script data-th-inline="javascript">
        "use strict";

        webeiderrors.hideErrorMessage();

        const loginFormEl = document.getElementById("login-form");

        loginFormEl.addEventListener("submit", async (event) => {
            event.preventDefault();
            webeiderrors.hideErrorMessage();
            // loginForm.disabled = true;

            const username = document.getElementById("username").value;

            try {
                const status = await webeid.status();
                const challengeResponse = await fetch("/pki/challenge", {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                });
                await webeiderrors.checkHttpError(challengeResponse);
                const { nonce } = await challengeResponse.json();
                const authToken = await webeid.authenticate(nonce, "en");
                const authTokenResponse = await fetch("/pki/login", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json",
                        "X-CSRF-TOKEN": [[${ _csrf.getToken() }]]
                    },
                    body: `{"auth-token": ${JSON.stringify(authToken)}, "username": ${JSON.stringify(username)}}`
                });
                await webeiderrors.checkHttpError(authTokenResponse);
                const { successURL } = await authTokenResponse.json();
                if (authTokenResponse.status === 200) {
                    window.location.href = successURL;
                } else {
                    window.location.reload();
                }
            } catch (error) {
                webeiderrors.showErrorMessage(error);
                throw error;
            }
            // finally {
            // loginForm.disabled = false;
            // }
        });
    </script>
</body>

</html>

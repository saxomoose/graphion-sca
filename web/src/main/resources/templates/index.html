<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/web/head :: frag(~{title = 'Home'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/web/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/web/notifications :: frag(${notifications})} : _"></div>
    <div class="alert alert-danger" id="error-message" role="alert" style="display: none;">
        <div class="message"></div>
        <pre class="details"></pre>
    </div>
    <footer data-th-replace="~{fragments/web/footer}"></footer>
    <script data-th-src="@{/js/web-eid.min.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/web-eid-errors.js}" type="text/javascript"></script>
    <script data-th-replace="~{fragments/web/authentication-script.html}"></script>
    <script data-th-replace="~{fragments/web/bootstrap-script}"></script>
    <script data-th-replace="~{fragments/web/toast-script}"></script>

</body>

</html>

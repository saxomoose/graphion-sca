<!DOCTYPE html>
<html lang="en" class="h-100">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Documents'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=3)}"></aside>
                <main class="col-md-6">
                    <div>
                        <a data-th-href="@{/documents/create}">Add document</a>
                    </div>
                    <!-- Table -->
                    <table id="documentTable" class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">Filename</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <th-block data-th-each="document : ${documentPage}">
                                <tr data-th-id="${document.id()}" class="clickableRow" role="button">
                                    <td data-th-text="${document.filename()}"></td>
                                </tr>
                            </th-block>
                        </tbody>
                    </table>
                    <nav data-th-replace="~{fragments/pagination :: frag(route = 'documents', page = ${documentPage})}">
                    </nav>
                    <!-- Modal -->
                    <div data-th-each="document: ${documentPage}" class="modal fade" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-body d-flex align-items-center">
                                    <a data-th-href="@{/files/{fileUUID}(fileUUID = __${document.fileUUID()}__, download = false)}"
                                        class="btn btn-primary me-2">View</a>
                                    <a data-th-href="@{/files/{fileUUID}(fileUUID = __${document.fileUUID()}__, download = true)}"
                                        class="btn btn-primary me-2">Download</a>
                                    <a class="btn btn-primary me-2">Edit</a>
                                    <a class="btn btn-danger me-2">Delete</a>
                                    <button type="button" class="ms-auto btn-close" data-bs-dismiss="modal"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>
</body>

</html>

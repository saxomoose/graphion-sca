<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Documents'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=3)}"></aside>
                <main class="col-md-10">
                    <nav class="d-flex flex-row-reverse">
                        <a class="trigger-tooltip" data-bs-placement="left" data-bs-title="Add document"
                            data-bs-toggle="tooltip" data-th-href="@{/documents/create}"><img
                                data-th-src="@{/svg/plus-circle.svg}" width="20" height="20"></a>
                    </nav>
                    <!-- Table -->
                    <table class="table table-hover" id="document-table">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Filename</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <th-block data-th-each="document,documentIterStat : ${documentPage}">
                                <tr data-th-id="${document.id()}">
                                    <th data-th-text="${documentPage.getNumber() * 10 + documentIterStat.getIndex() + 1}"
                                        scope="row">
                                    </th>
                                    <td data-th-text="${document.filename()}"></td>
                                    <td class="text-end"><img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                            role="button" width="20" height="20"></td>
                                </tr>
                            </th-block>
                        </tbody>
                    </table>
                    <nav data-th-replace="~{fragments/pagination :: frag(route = 'documents', page = ${documentPage})}">
                    </nav>
                    <!-- Modal -->
                    <th-block data-th-each="document: ${documentPage}">
                        <div class="modal fade" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-body d-flex align-items-center">
                                        <a class="btn btn-primary me-2"
                                            data-th-href="@{/files/{fileUUID}(fileUUID = __${document.fileUUID()}__, download = false)}">View</a>
                                        <a class="btn btn-primary me-2"
                                            data-th-href="@{/files/{fileUUID}(fileUUID = __${document.fileUUID()}__, download = true)}">Download</a>
                                        <a class="btn btn-primary me-2">Edit</a>
                                        <a class="btn btn-danger me-2">Delete</a>
                                        <button class="ms-auto btn-close" data-bs-dismiss="modal"
                                            type="button"></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </th-block>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/bootstrap-script}"></script>
    <script data-th-replace="~{fragments/modal-script}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
    <script data-th-replace="~{fragments/tooltip-script}"></script>
</body>

</html>

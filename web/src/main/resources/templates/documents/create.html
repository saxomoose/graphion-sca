<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Create document'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=3)}"></aside>
                <main class="col-md-10">
                    <div class="row">
                        <div class="col-md-4">
                            <form id="upload-form" data-th-action="@{/documents}" enctype="multipart/form-data"
                                method="post">
                                <input id="file-size" name="fileSize" type="hidden">
                                <div class="mb-3">
                                    <label class="form-label" for="filename">Filename</label>
                                    <input class="form-control" id="filename" name="filename" type="text">
                                </div>
                                <div class="mb-3">
                                    <input class="form-control" id="file" name="file" type="file"
                                        accept="application/pdf">
                                </div>
                                <button class="btn btn-primary" type="submit">Save</button>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/bootstrap-script}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
    <script data-th-inline="javascript">
        "use strict";
        function initializePage() {
            const fileEl = document.getElementById("file");
            const fileSizeEl = document.getElementById("file-size");
            fileEl.addEventListener("change", () => {
                const size = fileEl.files[0].size;
                console.log(size);
                fileSizeEl.value = size;
            }, false);
        }

        window.addEventListener("load", initializePage);
    </script>
</body>

</html>

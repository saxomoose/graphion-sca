<!DOCTYPE html>
<html lang="en" class="h-100">
<head data-th-replace="~{fragments/head :: frag(~{::title})}">
    <title>Create document</title>
</head>
<body class="d-flex flex-column h-100">
<header data-th-replace="~{fragments/header}"></header>
<div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
<div class="flex-shrink-0">
    <div class="container-fluid">
        <div class="row mt-3">
            <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=2)}"></aside>
            <main class="col-md-10">
                <div class="row">
                    <div class="col-md-4">
                        <form data-th-action="@{/documents}" data-th-object="${document}" enctype="multipart/form-data" method="post">
                            <div class="mb-3">
                                <label data-th-for="filename" class="form-label">Filename</label>
                                <input data-th-field="*{filename}" class="form-control">
                            </div>
                            <div class="mb-3">
                                <input id="file" name="file" type="file" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
<footer data-th-replace="~{fragments/footer}"></footer>
<script data-th-replace="~{fragments/scripts}"></script>
<div data-th-replace="~{fragments/toast-scripts}"></div>
</body>
</html>

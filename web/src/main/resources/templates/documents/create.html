<!DOCTYPE html>
<html lang="en" class="h-100">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Create document'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=2)}"></aside>
                <main class="col-md-10">
                    <div class="row">
                        <div class="col-md-4">
                            <form id="uploadForm" data-th-action="@{/documents}" enctype="multipart/form-data"
                                method="post">
                                <input id="fileSize" name="fileSize" type="hidden">
                                <div class="mb-3">
                                    <label for="filename" class="form-label">Filename</label>
                                    <input id="filename" name="filename" type="text" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <input id="file" name="file" type="file" accept="application/pdf"
                                        class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
    <script data-th-inline="javascript">
        "use strict";
        const fileEl = document.getElementById("file");
        const fileSizeEl = document.getElementById("fileSize");
        fileEl.addEventListener("change", () => {
            const size = fileEl.files[0].size;
            console.log(size);
            fileSizeEl.value = size;
        }, false);
    </script>
</body>

</html>

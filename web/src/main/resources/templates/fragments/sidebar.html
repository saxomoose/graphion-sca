<aside class="col-md-1" data-th-fragment="frag(activeNavLink)">
    <div class="offcanvas-md offcanvas-start" id="sidebar" data-bs-backdrop="static" tabindex="-1">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="sidebar-offcanvas-label">Menu</h5>
            <button class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" type="button"></button>
        </div>
        <div class="offcanvas-body">
            <th-block data-th-if="${#authorization.expression('hasAnyRole(''ADMIN'', ''USER'', ''SIGNATORY'')')}">
                <div class="d-flex flex-column">
                    <ul class="nav nav-pills flex-column mb-3">
                        <li class="nav-item">
                            <a class="nav-link text-center" data-bs-placement="right" data-bs-title="Dashboard"
                                data-bs-toggle="tooltip" data-th-classappend="${activeNavLink == 0} ? active : _"
                                data-th-href="@{/dashboard}">
                                <img class="me-2"
                                    data-th-src="@{/svg/ui-checks{color}.svg(color=(__${activeNavLink == 0}__ ? '-white' : ''))}"
                                    alt="vector-pen" width="32" height="32">
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-center" data-bs-placement="right" data-bs-title="Closings"
                                data-bs-toggle="tooltip" data-th-classappend="${activeNavLink == 1} ? active : _"
                                data-th-href="@{/closings}">
                                <img class="me-2"
                                    data-th-src="@{/svg/vector-pen{color}.svg(color=(__${activeNavLink == 1}__ ? '-white' : ''))}"
                                    alt="vector-pen" width="32" height="32">
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-center" data-bs-placement="right" data-bs-title="Users"
                                data-bs-toggle="tooltip" data-th-classappend="${activeNavLink == 2} ? active : _"
                                data-th-href="@{/users}">
                                <img class="me-2"
                                    data-th-src="@{/svg/person-vcard{color}.svg(color=(__${activeNavLink == 2}__ ? '-white' : ''))}"
                                    alt="person-card" width="32" height="32">
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-center" data-bs-placement="right" data-bs-title="Documents"
                                data-bs-toggle="tooltip" data-th-classappend="${activeNavLink == 3} ? active : _"
                                data-th-href="@{/documents}">
                                <img class="me-2"
                                    data-th-src="@{/svg/files{color}.svg(color=(__${activeNavLink == 3}__ ? '-white' : ''))}"
                                    alt="files" width="32" height="32">
                            </a>
                        </li>
                    </ul>
                    <div class="dropdown border-top d-flex" data-bs-placement="right" data-bs-title="Account"
                        data-bs-toggle="tooltip">
                        <a class="d-flex align-items-center p-3 dropdown-toggle" data-bs-toggle="dropdown" href="#">
                            <img data-th-src="@{/svg/person.svg}" width="32" height="32">
                        </a>
                        <ul class="dropdown-menu" style>
                            <li><a class="dropdown-item bg-transparent" href="#">Settings</a></li>
                            <li><a class="dropdown-item bg-transparent" href="#">Profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form class="dropdown-item bg-transparent" data-th-action="@{/logout}" method="post">
                                    <input class="btn btn-primary" type="submit" value="Log out">
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </th-block>
            <th-block data-th-if="${#authorization.expression('hasRole(''NULL'')')}">
                <div class="d-flex flex-column">
                    <ul class="nav nav-pills flex-column mb-3">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-bs-placement="right" data-bs-title="Organisations"
                                data-bs-toggle="tooltip">
                                <img class="me-2" data-th-src="@{/svg/diagram-3-white.svg}" width="32" height="32">
                            </a>
                        </li>
                    </ul>
                </div>
            </th-block>
        </div>
    </div>
</aside>

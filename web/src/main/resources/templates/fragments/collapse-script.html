<script type="text/javascript">
    "use-strict";
    function initializeCollapseScript() {
        const triggerCollapseElList = document.querySelectorAll(".trigger-collapse");
        const collapseElList = document.querySelectorAll(".collapse");

        if (triggerCollapseElList !== 0) {
            const collapseList =
                [...collapseElList].map(
                    collapseEl => new bootstrap.Collapse(collapseEl, { toggle: false }));
            console.log(collapseList);
            triggerCollapseElList.forEach(
                (triggerEl, index) => triggerEl.addEventListener(
                    "click",
                    () => {
                        collapseList[index].toggle();
                    }));
        }
    }

    window.addEventListener("load", initializeCollapseScript);
</script>

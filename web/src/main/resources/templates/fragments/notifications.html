<div class="position-relative" data-th-fragment="frag(notifications)">
    <div class="toast-container top-0 end-0 p-3">
        <th-block data-th-each="notification :${notifications}">
            <div class="toast" data-bs-autohide="false" role="alert">
                <div class="toast-header">
                    <strong class="me-auto" data-th-text="#{${notification.header}}"></strong>
                    <button class="btn-close" data-bs-dismiss="toast" type="button"></button>
                </div>
                <div class="toast-body">
                    <p data-th-text="#{${notification.body}}"></p>
                </div>
            </div>
        </th-block>
    </div>
</div>

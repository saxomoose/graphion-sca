<div data-th-fragment="frag(notifications)" class="position-relative">
    <div class="toast-container top-0 end-0 p-3">
        <th-block data-th-each="notification :${notifications}">
            <div class="toast" role="alert" data-bs-autohide="false">
                <div class="toast-header">
                    <strong data-th-text="#{${notification.header}}" class="me-auto"></strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body">
                    <p data-th-text="#{${notification.body}}"></p>
                </div>
            </div>
        </th-block>
    </div>
</div>

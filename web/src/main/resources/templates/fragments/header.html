<header class="container-fluid bg-light border-bottom" style="min-height: 50px;">
    <nav class="d-flex navbar navbar-expand-md align-items-center">
        <th-block data-th-if="${#authorization.expression('hasRole(''ANONYMOUS'')')}">
            <ul class="nav ms-auto">
                <li class="nav-item me-2">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" data-bs-auto-close="outside"
                            data-bs-toggle="dropdown" type="button">
                            Log in
                        </button>
                        <div class="dropdown-menu px-3 py-3" style="width: 260px;">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label" for="username">Username</label>
                                    <input class="form-control" id="username" name="username" type="email"
                                        placeholder="email@example.com" required>
                                </div>
                                <button class="btn btn-primary" id="loginButton" type="submit">Submit</button>
                            </form>
                        </div>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="btn btn-primary" data-th-href="@{/tenants/create}">Create organisation</a>
                </li>
            </ul>
        </th-block>
        <th-block data-th-if="${#authorization.expression('hasAnyRole(''ADMIN'', ''USER'', ''SIGNATORY'')')}">
            <a class="ms-3" data-th-href="@{/closings}">
                <img data-th-src="@{/svg/house.svg}" alt="graphion-logo" width="32" height="32">
            </a>
        </th-block>
        <th-block data-th-if="${#authorization.expression('hasAnyRole(''ADMIN'', ''USER'', ''SIGNATORY'', ''NULL'')')}">
            <button class="ms-auto navbar-toggler" data-bs-target="#sidebar" data-bs-toggle="offcanvas">
                <img data-th-src="@{/svg/offcanvas-button.svg}" alt="offcanvas-button" width="32" height="32">
            </button>
        </th-block>
    </nav>
</header>

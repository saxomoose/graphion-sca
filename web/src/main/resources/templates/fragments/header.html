<header class="container-fluid bg-light border-bottom">
    <nav class="d-flex navbar navbar-expand-md align-items-center">
        <a class="me-auto" data-th-href="@{/}">
            <img data-th-src="@{/svg/house.svg}" alt="graphion-logo" width="32" height="32">
        </a>
        <button class="navbar-toggler" data-bs-target="#sidebar" data-bs-toggle="offcanvas" data-sec-authorize="isAuthenticated()">
            <img data-th-src="@{/svg/offcanvas-button.svg}" alt="offcanvas-button" width="32" height="32">
        </button>
        <ul class="nav">
            <li class="nav-item" data-sec-authorize="!isAuthenticated()">
                <a class="nav-link px-2 link-dark" data-th-href="@{/login}">Login</a>
            </li>
            <li class="nav-item" data-sec-authorize="!isAuthenticated()">
                <a class="nav-link px-2 link-dark" data-th-href="@{/register}">Register</a>
            </li>
        </ul>
        <form data-sec-authorize="isAuthenticated()" data-th-action="@{/logout}" method="post">
            <input type="submit" value="Log out">
        </form>
    </nav>
</header>

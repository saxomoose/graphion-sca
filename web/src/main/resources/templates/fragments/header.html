    <nav class="navbar navbar-expand-md bg-light border-bottom">
        <div class="container-fluid">

                <svg xmlns="http://www.w3.org/2000/svg" class="bi me-2" width="40" height="32" role="img" aria-label="webshop" >

                </svg>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="bi" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.5 11.5A.5.5 0 0 1 3 11h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4A.5.5 0 0 1 3 7h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4A.5.5 0 0 1 3 3h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"></path>

            <a data-sec-authorize="!isAuthenticated()" data-th-href="@{/register}"  type="button" class="btn btn-primary">Register</a>
            <form data-sec-authorize="isAuthenticated()" data-th-href="@{/perform_logout}" method="post">
                <button type="submit" class="btn btn-primary">Log out</button>
            </form>
        </div>
    </nav>

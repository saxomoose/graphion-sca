<header class="container-fluid bg-light border-bottom">
    <nav class="navbar navbar-expand-md d-flex align-items-center">
        <a data-th-href="@{/}" class="me-auto">
            <img data-th-src="@{/svg/house.svg}" alt="graphion-logo" width="32" height="32">
        </a>
        <button class="navbar-toggler " type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
            <img data-th-src="@{/svg/offcanvas-button.svg}" alt="offcanvas-button" width="32" height="32" class="filter-white">
        </button>
        <a data-sec-authorize="!isAuthenticated()" data-th-href="@{/login}"  type="button" class="btn btn-outline-primary" >Login</a>
        <a data-sec-authorize="!isAuthenticated()" data-th-href="@{/register}"  type="button" class="btn btn-primary">Register</a>
        <form data-sec-authorize="isAuthenticated()" data-th-href="@{/perform_logout}" method="post">
            <button type="submit" class="btn btn-primary">Log out</button>
        </form>
    </nav>
</header>

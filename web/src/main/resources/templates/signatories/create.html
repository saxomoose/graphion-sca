<!DOCTYPE html>
<html lang="en" class="h-100">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Create document'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink = 2)}"></aside>
                <main class="col-md-10">
                    <div class="row">
                        <div class="col-md-4">
                            <form id="uploadForm" data-th-action="@{/signatories}" method="post">
                                <div class="mb-3">
                                    <label for="firstName" class="form-label">First name</label>
                                    <input id="firstName" name="firstName" type="text" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Last name</label>
                                    <input id="lastName" name="lastName" type="text" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="dateOfBirth" class="form-label">Date of birth</label>
                                    <input id="dateOfBirth" name="dateOfBirth" type="date" class="form-control">
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email</label>
                                    <input id="email" name="email" type="email" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label for="nationalRegistrationNumber" class="form-label">National registration
                                        number</label>
                                    <input id="nationalRegistrationNumber" name="nationalRegistrationNumber" type="text"
                                        class="form-control">
                                </div>
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
</body>

</html>

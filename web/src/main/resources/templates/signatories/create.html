<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Create document'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink = 2)}"></aside>
                <main class="col-md-10">
                    <div class="row">
                        <div class="col-md-4">
                            <form id="uploadForm" data-th-action="@{/signatories/{method}(method = 'dob')}" method="post">
                                <div class="mb-3">
                                    <label class="form-label" for="firstName">First name</label>
                                    <input class="form-control" id="firstName" name="firstName" type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="lastName">Last name</label>
                                    <input class="form-control" id="lastName" name="lastName" type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="email">Email</label>
                                    <input class="form-control" id="email" name="email" type="email" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Select how the signatory should be identified:</label>
                                    <div class="form-check">
                                        <input class="form-check-input" id="dobOption" name="option" type="radio" checked>
                                        <label class="form-check-label" for="dobOption">Date of birth</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" id="nrnOption" name="option" type="radio">
                                        <label class="form-check-label" for="nrnOption">National registration number</label>
                                    </div>
                                </div>
                                
                                <div class="mb-3" id="dobCollapsible">
                                    <label class="form-label" for="dateOfBirth">Date of birth</label>
                                    <input class="form-control" id="dateOfBirth" name="dateOfBirth" type="date">
                                </div>
                                <div class="mb-3 d-none" id="nrnCollapsible">
                                    <label class="form-label" for="nationalRegistrationNumber">National registration number</label>
                                    <input class="form-control" id="nationalRegistrationNumber" name="nationalRegistrationNumber" data-slots="_" type="text" placeholder="__.__.__-___-__">
                                </div>
                                <button class="btn btn-primary" type="submit">Submit</button>
                            </form>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
    <script>
        const options = document.querySelectorAll("input[name=\"option\"]");
        const dobCollapsible = document.getElementById("dobCollapsible");
        const nrnCollapsible = document.getElementById("nrnCollapsible");

        options.forEach(option => {
            option.addEventListener("change", (event) => {
                if (event.target.id === "dobOption") {
                    dobCollapsible.classList.remove("d-none");
                    nrnCollapsible.classList.add("d-none");
                    document.getElementById("dateOfBirth").required = true;
                    document.getElementById("nationalRegistrationNumber").required = false;
                    document.getElementById("uploadForm").setAttribute("action", "/signatories/dob");
                } else if (event.target.id === "nrnOption") {
                    dobCollapsible.classList.add("d-none");
                    nrnCollapsible.classList.remove("d-none");
                    document.getElementById("dateOfBirth").required = false;
                    document.getElementById("nationalRegistrationNumber").required = true;
                    document.getElementById("uploadForm").setAttribute("action", "/signatories/nrn");
                }
            });
        });
    </script>
    <script>
        for (const el of document.querySelectorAll("[placeholder][data-slots]")) {
            const pattern = el.getAttribute("placeholder");
            const slots = new Set(el.dataset.slots || "_");
            const prev = (j => Array.from(pattern, (c, i) => slots.has(c) ? j = i + 1 : j))(0);
            const first = [...pattern].findIndex(c => slots.has(c));
            const accept = new RegExp(el.dataset.accept || "\\d", "g");
            const clean = input => {
                input = input.match(accept) || [];
                return Array.from(pattern, c => input[0] === c || slots.has(c) ? input.shift() || c : c);
            };
            const format = () => {
                const [i, j] = [el.selectionStart, el.selectionEnd].map(i => {
                    i = clean(el.value.slice(0, i)).findIndex(c => slots.has(c));
                    return i < 0 ? prev[prev.length - 1] : back ? prev[i - 1] || first : i;
                });
                el.value = clean(el.value).join``;
                el.setSelectionRange(i, j);
                back = false;
            };
            let back = false;
            el.addEventListener("keydown", (e) => back = e.key === "Backspace");
            el.addEventListener("input", format);
            el.addEventListener("focus", format);
            el.addEventListener("blur", () => el.value === pattern && (el.value = ""));
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en" class="h-100">

<head data-th-replace="~{fragments/head :: frag(~{::title})}">
    <title>Signatories</title>
</head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=2)}"></aside>
                <main class="col-md-6">
                    <div>
                        <a data-th-href="@{/signatories/create}">Add signatory</a>
                    </div>
                    <!-- Table -->
                    <table id="signatoryTable" class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">Last name</th>
                                <th scope="col">First name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Electronic signature consent</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <th-block data-th-each="signatory : ${signatoryPage}">
                                <tr data-th-id="${signatory.id()}" class="clickableRow" role="button">
                                    <td data-th-text="${signatory.lastName()}"></td>
                                    <td data-th-text="${signatory.firstName()}"></td>
                                    <td data-th-text="${signatory.email()}"></td>
                                    <td data-th-text="${signatory.consent()}"></td>
                                </tr>
                            </th-block>
                        </tbody>
                    </table>
                    <nav
                        data-th-replace="~{fragments/pagination :: frag(route = 'signatories', page = ${signatoryPage})}">
                    </nav>
                    <!-- Modal -->
                    <!-- <div data-th-each="signatory: ${signatoryPage}" class="modal fade" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-body d-flex align-items-center">
                                    <a data-th-href="@{/files/{fileUUID}(fileUUID = __${signatory.fileUUID()}__, download = false)}"
                                        class="btn btn-primary me-2">View</a>
                                    <a data-th-href="@{/files/{fileUUID}(fileUUID = __${signatory.fileUUID()}__, download = true)}"
                                        class="btn btn-primary me-2">Download</a>
                                    <a class="btn btn-primary me-2">Edit</a>
                                    <a class="btn btn-danger me-2">Delete</a>
                                    <button type="button" class="ms-auto btn-close" data-bs-dismiss="modal"></button>
                                </div>
                            </div>
                        </div>
                    </div> -->
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>
</body>

</html>

<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/web/head :: frag(~{title = 'tenants'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/web/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/web/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/web/sidebar :: frag(activeNavLink = null)}"></aside>
                <main class="col-md-6">
                    <!-- Table -->
                    <table class="table table-hover caption-top" id="tenant-table">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Name</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <th-block data-th-each="tenant,tenantIterStat : ${tenantPage}">
                                <tr data-th-id="${tenant.id()}">
                                    <th data-th-text="${tenantPage.getNumber() * 10 + tenantIterStat.getIndex() + 1}"
                                        scope="row">
                                    </th>
                                    <td data-th-id="${tenant.id()}" data-th-text="${tenant.name()}" role="button"></td>
                                    <td class="text-end"><img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                            role="button" width="20" height="20"></td>
                                </tr>
                            </th-block>
                        </tbody>
                    </table>
                    <nav data-th-replace="~{fragments/web/pagination :: frag(route = 'tenants', page = ${tenantPage})}">
                    </nav>
                    <!-- Modal -->
                    <div class="modal fade" data-th-each="tenant: ${tenantPage}" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-body d-flex align-items-center">
                                    <form class="me-2"
                                        data-th-action="@{/authorization/{tenantName}(tenantName = __${tenant.name()}__, setDefaultConnection = false)}"
                                        method="post">
                                        <input class="btn btn-primary" type="submit" value="View">
                                    </form>
                                    <form class="me-auto"
                                        data-th-action="@{/authorization/{tenantName}(tenantName = __${tenant.name()}__, setDefaultConnection = true)}"
                                        method="post">
                                        <input class="btn btn-primary" type="submit" value="Select as default">
                                    </form>
                                    <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/web/footer}"></footer>
    <script data-th-replace="~{fragments/web/bootstrap-script}"></script>
    <script data-th-replace="~{fragments/web/modal-script}"></script>
    <script data-th-replace="~{fragments/web/toast-script}"></script>
    <script data-th-replace="~{fragments/web/tooltip-script}"></script>
</body>

</html>

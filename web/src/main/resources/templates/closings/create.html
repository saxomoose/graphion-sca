<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Create closing'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink = 1)}"></aside>
                <main class="col-md-10">
                    <nav data-th-replace="~{fragments/info-trigger}"></nav>
                    <form id="closing-form" data-th-action="@{/closings}" method="post">
                        <div class="row">
                            <th-block data-th-each="user,userIterStat : ${users}">
                                <div class="col-md-4">
                                    <label class="form-label" data-th-for="${#strings.concat('document-select-', user.id())}" data-th-text="${#strings.concat('Documents - ', user.username())}"></label>
                                    <select class="form-select mb-1" data-th-id="${user.id()}" data-th-name="${user.id()}" data-th-size="${documents.size()}" multiple required>
                                        <th-block data-th-each="document,documentIterStat : ${documents}">
                                            <option data-th-text="${document.filename()}" data-th-value="${document.id()}">
                                            </option>
                                        </th-block>
                                    </select>
                                </div>
                            </th-block>
                        </div>
                        <input class="d-none" id="send-invites-input" name="sendInvites" type="checkbox">
                        <div class="d-flex flex-row-reverse">
                            <div class="btn-group">
                                <button class="btn btn-primary" id="save-submit-button" type="submit">Save</button>
                                <button class="btn btn-secondary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" type="button">
                                </button>
                                <ul class="dropdown-menu">
                                    <li><button class="dropdown-item" id="save-send-submit-button" type="submit">Save and send invites</button></li>
                                </ul>
                            </div>
                        </div>
                    </form>
                    <div class="collapse row">
                        <div class="col-md-8 mt-3 p-3 bg-light rounded-4">
                            <h1 class="h5 text-muted">Closing creation form</h1>
                            <p class="text-muted">Creating a closing is a two-step process. On this page page, users stipulate which documents should be signed by each party</p>
                            <div class="ms-4">
                                <h2 class="h6 text-muted">Documents - [username]</h2>
                                <p class=text-muted>Users stipulate which documents should be signed by that party.</p>
                                <ul>
                                    <li class="text-muted"></li>
                                </ul>
                            </div>
                            <p class="text-muted">All fields are mandatory.</p>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/bootstrap-script}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
    <script data-th-replace="~{fragments/multiple-select-script}"></script>
    <script data-th-replace="~{fragments/collapse-script}"></script>
    <script>
        "use strict";
        function initializePage() {
            // Form
            const closingFormEl = document.getElementById("closing-form");
            const sendInvitesInputEl = document.getElementById("send-invites-input");

            // Form
            closingFormEl.addEventListener("submit", (event) => {
                const activeElementId = document.activeElement.id;
                if (activeElementId === "save-send-submit-button") {
                    sendInvitesInputEl.checked = true;
                }
                sessionStorage.removeItem("name");
                sessionStorage.removeItem("timestamp");
                sessionStorage.removeItem("zone-id");
                sessionStorage.removeItem("location");
                sessionStorage.removeItem("expiration-timestamp");
                sessionStorage.removeItem("userDict");
                sessionStorage.removeItem("documentDict");
            });
        }
        window.addEventListener("load", initializePage);
    </script>
</body>

</html>

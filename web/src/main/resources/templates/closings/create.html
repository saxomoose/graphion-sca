<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Create user'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink = 1)}"></aside>
                <main class="col-md-9">
                    <form id="uploadForm" data-th-action="@{/closings}" method="post">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="mb-3">
                                    <label class="form-label" for="name">Name</label>
                                    <input class="form-control" id="name" name="name" type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="timestamp">Time</label>
                                    <input class="form-control" id="timestamp" name="timestamp" type="datetime-local"
                                        required>
                                </div>
                                <div data-th-replace="~{fragments/zoneid-picker}"></div>
                                <div class="mb-3">
                                    <label class="form-label" for="location">Location</label>
                                    <input class="form-control" id="location" name="location" type="text" required>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="mb-3">
                                    <label class="form-label" for="userSelect">Users</label>
                                    <select class="form-select mb-1" id="userSelect" name="users" multiple size="10"
                                        required>
                                        <th-block data-th-each="user,userIterStat : ${userPage}">
                                            <option
                                                data-th-text="${#strings.concat(user.firstName(), ' ', user.lastName(), ' - ', user.username())}"
                                                data-th-value="${user.id()}">
                                            </option>
                                        </th-block>
                                    </select>
                                    <nav class="d-flex flex-row-reverse">
                                        <ul class="pagination">
                                            <li class="page-item"
                                                data-th-classappend="${userPage.isFirst() ? 'disabled' : _}">
                                                <a class="page-link"
                                                    data-th-href="@{/{route}(route = 'closings/create', userPageIndex = __${userPage.getNumber() - 1}__)}">
                                                    <span>&laquo;</span>
                                                </a>
                                            </li>
                                            <li class="page-item"
                                                data-th-classappend="${userPage.isLast() ? 'disabled' : _}">
                                                <a class="page-link"
                                                    data-th-href="@{/{route}(route = 'closings/create', userPageIndex = __${userPage.getNumber() + 1}__)}">
                                                    <span>&raquo;</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label" for="documentSelect">Documents</label>
                                    <select class="form-select mb-1" id="documentSelect" name="documents" multiple
                                        size="10" required>
                                        <th-block data-th-each="document,documentIterStat : ${documentPage}">
                                            <option data-th-text="${document.filename()}"
                                                data-th-value="${document.id()}">
                                            </option>
                                        </th-block>
                                    </select>
                                    <nav class="d-flex flex-row-reverse">
                                        <ul class="pagination">
                                            <li class="page-item"
                                                data-th-classappend="${documentPage.isFirst() ? 'disabled' : _}">
                                                <a class="page-link"
                                                    data-th-href="@{/{route}(route = 'closings/create', documentPageIndex = __${documentPage.getNumber() - 1}__)}">
                                                    <span>&laquo;</span>
                                                </a>
                                            </li>
                                            <li class="page-item"
                                                data-th-classappend="${documentPage.isLast() ? 'disabled' : _}">
                                                <a class="page-link"
                                                    data-th-href="@{/{route}(route = 'closings/create', documentPageIndex = __${documentPage.getNumber() + 1}__)}">
                                                    <span>&raquo;</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-primary" type="submit">Submit</button>
                    </form>
                </main>
            </div>
        </div>
    </div>

    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
</body>

</html>

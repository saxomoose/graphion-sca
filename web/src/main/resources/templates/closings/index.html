<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Closings'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=1)}"></aside>
                <main class="col-md-6">
                    <div>
                        <a data-th-href="@{/closings/create}">Add closing</a>
                    </div>
                    <!-- Table -->
                    <table class="table table-hover" id="closingTable">
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Time</th>
                                <th scope="col">Location</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <th-block data-th-each="closing : ${closingPage}">
                                <tr class="clickableRow" data-th-id="${closing.id()}" role="button">
                                    <td data-th-text="${closing.name()}"></td>
                                    <td data-th-text="${#temporals.format(closing.zonedTimestamp(), 'dd/MM/yyyy HH:mm XXX')}">
                                    </td>
                                    <td data-th-text="${closing.location()}"></td>
                                </tr>
                            </th-block>
                        </tbody>
                    </table>
                    <nav data-th-replace="~{fragments/pagination :: frag(route = 'closings', page = ${closingPage})}">
                    </nav>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>
</body>

</html>

<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Closings'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=1)}"></aside>
                <main class="col-md-10">
                    <div class="row">
                        <nav class="d-flex flex-row-reverse">
                            <a data-th-href="@{/closings/create}"><img data-th-src="@{/svg/plus-circle.svg}" width="20"
                                    height="20"></a>
                        </nav>
                        <!-- Table -->
                        <table class="table table-hover" id="closing-table">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Closing timestamp</th>
                                    <th scope="col">Location</th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <th-block data-th-each="closing,closingIterStat : ${closingToIndex.closingPage()}">
                                    <tr data-th-id="${closing.id()}">
                                        <th data-th-text="${closingToIndex.closingPage().getNumber() * 10 + closingIterStat.getIndex() + 1}"
                                            scope="row">
                                        </th>
                                        <td data-th-text="${closing.name()}"></td>
                                        <td
                                            data-th-text="${#temporals.format(closing.zonedTimestamp(), 'dd/MM/yyyy HH:mm XXX')}">
                                        </td>
                                        <td data-th-text="${closing.location()}"></td>
                                        <td>
                                            <input class="trigger-collapse-radio form-check-input me-2"
                                                name="closingRadio"
                                                data-th-id="${#strings.concat('trigger-collapse-closing-', closing.id())}"
                                                type="radio">
                                            <img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                                role="button" width="20" height="20">
                                        </td>
                                    </tr>
                                </th-block>
                            </tbody>
                        </table>
                        <nav
                            data-th-replace="~{fragments/pagination :: frag(route = 'closings', page = ${closingToIndex.closingPage()})}">
                        </nav>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <th-block data-th-each="closingUsers : ${closingToIndex.closingUsers()}">
                                <table class="table table-hover collapsible d-none"
                                    data-th-id="${#strings.concat('user-table-', closingUsers.getKey())}">
                                    <thead>
                                        <th scope="col">Last name</th>
                                        <th scope="col">First name</th>
                                        <th scope="col">Email</th>
                                        <th scope="col"><input class="form-check-input me-2" type="checkbox"
                                                id="trigger-collapse-user-all">
                                        </th>
                                    </thead>
                                    <tbody>
                                        <th-block data-th-each="user,userIterStat : ${closingUsers.getValue()}">
                                            <tr>
                                                <td data-th-text="${user.lastName()}"></td>
                                                <td data-th-text="${user.firstName()}"></td>
                                                <td data-th-text="${user.username()}"></td>
                                                <td>
                                                    <input class="trigger-collapse-checkbox form-check-input me-2"
                                                        data-th-id="${#strings.concat('trigger-collapse-user-', user.id())}"
                                                        type="checkbox">
                                                    <img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                                        role="button" width="20" height="20">
                                                </td>
                                            </tr>
                                        </th-block>
                                    </tbody>
                                </table>
                            </th-block>
                        </div>
                        <div class="col-md-6">
                            <th-block data-th-each="userDocumentsOuter : ${closingToIndex.userDocuments()}">
                                <th-block data-th-each=" userDocumentsInner : ${userDocumentsOuter.getValue()}">
                                    <table class="table table-hover collapse"
                                        data-th-id="${#strings.concat('document-table-', userDocumentsInner.getKey())}">
                                        <thead>
                                            <th scope="col">Filename</th>
                                            <th scope="col">Signature timestamp</th>
                                            <th scope="col"></th>
                                        </thead>
                                        <tbody>
                                            <th-block data-th-each="document : ${userDocumentsInner.getValue()}">
                                                <tr>
                                                    <td data-th-text="${document.filename()}"></td>
                                                    <td
                                                        data-th-text="${document.signatureTimestamp() != null ?  document.signatureTimestamp() : 'Not signed'}">
                                                    </td>
                                                    <td style="all: none;"><img data-th-src="@{/svg/three-dots.svg}"
                                                            width="20" height="20">
                                                    </td>
                                                </tr>
                                            </th-block>
                                        </tbody>
                                    </table>
                                </th-block>
                            </th-block>
                        </div>
                    </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>

                        </th-block>
                    </th-block> -->
                </main>
            </div>
        </div>
    </div>

    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>

    <script type="text/javascript">
        const closingHeader = document.getElementById("closingHeader");
        const userHeader = document.getElementById("userHeader");
        const documentHeader = document.getElementById("documentHeader");

        const tableRowElList = document.querySelectorAll(".table-row");
        if (tableRowElList !== 0) {
            tableRowElList.forEach(
                (tableRowEl, index) => tableRowEl.addEventListener(
                    "click",
                    () => {
                        if (tableRowEl.classList.contains("closing-row")) {
                            // Swap to closingHeader
                            closingHeader.classList.remove("d-none");
                            userHeader.classList.add("d-none");
                            documentHeader.classList.add("d-none");
                        } else if (tableRowEl.classList.contains("user-row")) {
                            closingHeader.classList.add("d-none");
                            userHeader.classList.remove("d-none");
                            documentHeader.classList.add("d-none");
                        } else if (tableRowEl.classList.contains("document-row")) {
                            closingHeader.classList.add("d-none");
                            userHeader.classList.add("d-none");
                            documentHeader.classList.remove("d-none");
                        }
                    }));
        }
    </script>
    <script type="text/javascript">
        const triggerRadioElList = document.querySelectorAll(".trigger-collapse-radio");
        const collapsibleElList = document.querySelectorAll(".collapsible");
        const triggerCheckboxElList = document.querySelectorAll(".trigger-collapse-checkbox");
        const collapseElList = document.querySelectorAll(".collapse");
        const triggerCheckboxAll = document.getElementById("trigger-collapse-user-all");

        const collapseList = [...collapseElList].map(
            collapseEl => new bootstrap.Collapse(collapseEl, { toggle: false }));
        console.log(collapseList);

        triggerRadioElList.forEach((triggerRadioEl) => {
            triggerRadioEl.addEventListener(
                "change",
                (event) => {
                    // Check if the current radio input is checked
                    if (event.target.checked) {
                        // Retrieve the value of the checked radio input
                        const targetIndex = event.target.id.slice(-1);
                        const targetEl = document.getElementById("user-table-".concat(targetIndex));
                        collapsibleElList.forEach(collapsibleEl => collapsibleEl.classList.add("d-none"));
                        collapseList.forEach(collapse => collapse.hide());
                        triggerCheckboxElList.forEach((triggerCheckboxEl) => {
                            triggerCheckboxEl.checked = false;
                        });
                        targetEl.classList.remove("d-none");
                    }
                });
        });

        triggerCheckboxAll.addEventListener(
            "change",
            (event) => {
                if (triggerCheckboxAll.checked) {
                    triggerCheckboxElList.forEach((triggerCheckboxEl) => {
                        triggerCheckboxEl.checked = true;
                        triggerCheckboxEl.dispatchEvent(new Event("change"));
                    });
                } else {
                    triggerCheckboxElList.forEach((triggerCheckboxEl) => {
                        triggerCheckboxEl.checked = false;
                        triggerCheckboxEl.dispatchEvent(new Event("change"));
                    });
                }
            });

        triggerCheckboxElList.forEach(
            (triggerEl, index) => triggerEl.addEventListener(
                "change",
                (event) => {
                    collapseList[index].toggle();
                }));
    </script>
</body>

</html>

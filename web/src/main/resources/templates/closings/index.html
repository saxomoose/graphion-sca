<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Closings'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=1)}"></aside>
                <main class="col-md-10">
                    <div>
                        <a data-th-href="@{/closings/create}">Add closing</a>
                    </div>
                    <!-- Table -->
                    <div class="container-fluid" id="closingTable">
                        <div class="row mt-2">
                            <div class="col-1 fw-bold">#</div>
                            <div class="col-4 fw-bold">Name</div>
                            <div class="col-4 fw-bold">Time</div>
                            <div class="col-3 fw-bold">Location</div>
                        </div>
                        <hr class="border border-dark mt-2 mb-0 opacity-50">
                        <div class="mb-2">
                            <th-block data-th-each="closing,closingIterStat : ${closingPage}">
                                <a class="row py-2 border-bottom anchor-hover text-decoration-none text-dark"
                                    data-th-classappend="${closingIterStat.getIndex() == 0 ? 'firstItem' : _ }"
                                    data-th-id="${closing.id()}" href="#">
                                    <div class="col-1" data-th-text="${closingIterStat.getIndex() + 1}"></div>
                                    <div class="col-4 " data-th-text="${closing.name()}"></div>
                                    <div class="col-4 "
                                        data-th-text="${#temporals.format(closing.zonedTimestamp(), 'dd/MM/yyyy HH:mm XXX')}">
                                    </div>
                                    <div class="col-3" data-th-text="${closing.location()}"></div>
                                </a>
                                <th-block data-th-each="user,userIterStat : ${closing.users()}">
                                    <a class="row py-2 border-bottom anchor-hover text-decoration-none text-dark"
                                        data-th-classappend="${userIterStat.getIndex() == 0 ? 'firstItem' : _ }"
                                        data-th-id="${user.id()}" href="#">
                                        <div class="col-1"
                                            data-th-text="${#strings.concat(closingIterStat.getIndex() + 1, '.', userIterStat.getIndex() + 1)}">
                                        </div>
                                        <div class="col-4 " data-th-text="${user.firstName()}"></div>
                                        <div class="col-4 " data-th-text="${user.lastName()}"></div>
                                        <div class="col-3 " data-th-text="${user.username()}"></div>
                                    </a>
                                    <th-block data-th-each="document,documentIterStat : ${user.documents()}">
                                        <a class="row py-2 border-bottom anchor-hover text-decoration-none text-dark"
                                            data-th-classappend="${documentIterStat.getIndex() == 0 ? 'firstItem' : _ }"
                                            data-th-id="${document.id()}" href="#">
                                            <div class="col-1"
                                                data-th-text="${#strings.concat(closingIterStat.getIndex() + 1, '.', userIterStat.getIndex() + 1, '.', documentIterStat.getIndex() + 1)}">
                                            </div>
                                            <div class="col-4 " data-th-text="${document.filename()}">
                                            </div>
                                            <div class="col-4 "
                                                data-th-text="${#dates.format(document.signatureTimestamp(), 'yyyy-MM-dd HH:mm:ss')} ?: 'Not signed'">
                                            </div>
                                        </a>
                                    </th-block>
                                </th-block>
                            </th-block>
                        </div>
                        <nav
                            data-th-replace="~{fragments/pagination :: frag(route = 'closings', page = ${closingPage})}">
                        </nav>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>
</body>

</html>

<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Closings'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=1)}"></aside>
                <main class="col-md-10">
                    <div class="row">
                        <nav class="d-flex flex-row-reverse">
                            <a data-th-href="@{/closings/create}"><img data-th-src="@{/svg/plus-circle.svg}" width="20"
                                    height="20"></a>
                        </nav>
                        <!-- Table -->
                        <table class="table table-hover" id="closing-table">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Closing timestamp</th>
                                    <th scope="col">Location</th>
                                    <th scope="col"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <th-block data-th-each="closing,closingIterStat : ${closingToIndex.closingPage()}">
                                    <tr class="activable-row" data-th-id="${closing.id()}">
                                        <th data-th-text="${closingToIndex.closingPage().getNumber() * 10 + closingIterStat.getIndex() + 1}"
                                            scope="row">
                                        </th>
                                        <td data-th-text="${closing.name()}"></td>
                                        <td
                                            data-th-text="${#temporals.format(closing.zonedTimestamp(), 'dd/MM/yyyy HH:mm XXX')}">
                                        </td>
                                        <td data-th-text="${closing.location()}"></td>
                                        <td class="text-end"><input
                                                class="trigger-collapse trigger-root form-check-input me-2"
                                                data-th-id="${#strings.concat('trigger-collapse-closing-', closing.id())}"
                                                type="checkbox">
                                            <img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                                role="button" width="20" height="20">
                                        </td>
                                    </tr>
                                    <div class="modal fade" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content">
                                                <div class="modal-body d-flex align-items-center">
                                                    <a class="btn btn-primary me-2">Send invites</a>
                                                    <a class="btn btn-primary me-2">Edit</a>
                                                    <a class="btn btn-danger me-2">Delete</a>
                                                    <button class="ms-auto btn-close" data-bs-dismiss="modal"
                                                        type="button"></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </th-block>
                            </tbody>
                        </table>
                        <nav
                            data-th-replace="~{fragments/pagination :: frag(route = 'closings', page = ${closingToIndex.closingPage()})}">
                        </nav>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <th-block data-th-each="closing : ${closingToIndex.users()}">
                                <table class="table table-user table-hover collapse"
                                    data-th-id="${#strings.concat('user-table-', closing.getKey().id())}">
                                    <caption class="text-muted"
                                        data-th-text="${#strings.concat(closing.getKey().name(), ' - signatories')}">
                                    </caption>
                                    <thead>
                                        <th scope="col">Last name</th>
                                        <th scope="col">First name</th>
                                        <th scope="col">Email</th>
                                        <th scope="col"><input class="trigger-collapse-all form-check-input"
                                                type="checkbox">
                                        </th>
                                    </thead>
                                    <tbody>
                                        <th-block data-th-each="user,userIterStat : ${closing.getValue()}">
                                            <tr class="activable-row">
                                                <td data-th-text="${user.lastName()}"></td>
                                                <td data-th-text="${user.firstName()}"></td>
                                                <td data-th-text="${user.username()}"></td>
                                                <td>
                                                    <input
                                                        class="trigger-collapse trigger-collapse-user form-check-input me-2"
                                                        data-th-id="${#strings.concat('trigger-collapse-user-', user.id())}"
                                                        type="checkbox">
                                                    <img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                                        role="button" width="20" height="20">
                                                </td>
                                            </tr>
                                            <div class="modal fade" tabindex="-1">
                                                <div class="modal-dialog modal-dialog-centered">
                                                    <div class="modal-content">
                                                        <div class="modal-body d-flex align-items-center">
                                                            <a class="btn btn-primary" data-th-href="@{/users}">View</a>
                                                            <button class="ms-auto btn-close" data-bs-dismiss="modal"
                                                                type="button"></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </th-block>
                                    </tbody>
                                </table>
                            </th-block>
                        </div>
                        <div class="col-md-6">
                            <th-block data-th-each="closing : ${closingToIndex.documents()}">
                                <th-block data-th-each="user : ${closing.getValue()}">
                                    <table class="table table-hover collapse"
                                        data-th-id="${#strings.concat('document-table-', closing.getKey(), '-',  user.getKey().id())}">
                                        <caption class="text-muted"
                                            data-th-text="${#strings.concat(user.getKey().username(), ' - documents')}">
                                        </caption>
                                        <thead>
                                            <th scope="col">Filename</th>
                                            <th scope="col">Signature timestamp</th>
                                            <th scope="col"></th>
                                        </thead>
                                        <tbody>
                                            <th-block data-th-each="document : ${user.getValue()}">
                                                <tr>
                                                    <td data-th-text="${document.filename()}"></td>
                                                    <td
                                                        data-th-text="${document.signatureTimestamp() != null ?  document.signatureTimestamp() : 'Not signed'}">
                                                    </td>
                                                    <td><img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                                            role="button" width="20" height="20">
                                                    </td>
                                                </tr>
                                                <div class="modal fade" tabindex="-1">
                                                    <div class="modal-dialog modal-dialog-centered">
                                                        <div class="modal-content">
                                                            <div class="modal-body d-flex align-items-center">
                                                                <a class="btn btn-primary"
                                                                    data-th-href="@{/documents}">View</a>
                                                                <button class="ms-auto btn-close"
                                                                    data-bs-dismiss="modal" type="button"></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </th-block>
                                        </tbody>
                                    </table>
                                </th-block>
                            </th-block>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>

    <script type="text/javascript">
        const triggerCollapseElList = document.querySelectorAll(".trigger-collapse");
        const activableRowList = document.querySelectorAll(".activable-row");
        const activeRowElArray = new Array();
        const userRowElList = document.querySelectorAll(".user-row");
        const collapseElList = document.querySelectorAll(".collapse");
        const triggerCollapseAllElList = document.querySelectorAll(".trigger-collapse-all");

        const collapseList = [...collapseElList].map(
            collapseEl => new bootstrap.Collapse(collapseEl, { toggle: false }));
        console.log(collapseList);

        triggerCollapseElList.forEach(
            (triggerEl, index) => triggerEl.addEventListener(
                "change",
                (event) => {
                    if (event.target.checked) {
                        if (event.target.classList.contains("trigger-root")) {
                            triggerCollapseElList.forEach(triggerCollapseEl => {
                                if (triggerCollapseEl.classList.contains("trigger-root") && triggerCollapseEl !== event.target) {
                                    triggerCollapseEl.setAttribute("disabled", "");
                                }
                            });
                        }
                        activableRowList.forEach(activableRowEl => {
                            activeRowElArray.push(activableRowList[index]);
                            activeRowElArray.forEach(activeRowEl => activeRowEl.classList.add("table-active"));
                        });
                    } else if (!event.target.checked) {
                        if (event.target.classList.contains("trigger-root")) {
                            triggerCollapseAllElList.forEach(triggerCollapseAllEl => triggerCollapseAllEl.checked = false);
                            triggerCollapseElList.forEach(triggerCollapseEl => triggerCollapseEl.checked = false);
                            collapseList.forEach(collapse => collapse.hide());
                            triggerCollapseElList.forEach(triggerCollapseEl => {
                                if (triggerCollapseEl.classList.contains("trigger-root") && triggerCollapseEl !== event.target) {
                                    triggerCollapseEl.removeAttribute("disabled", "");
                                }
                            });
                            activeRowElArray.forEach(activeRowEl => {
                                activeRowEl.classList.remove("table-active");
                            });
                            activeRowElArray.length = 0;
                        } else if (event.target.classList.contains("trigger-collapse-user")) {
                            const table = event.target.closest("table");
                            const triggerCollapseAllEl = table.querySelectorAll('.trigger-collapse-all')[0];
                            if (triggerCollapseAllEl.checked) {
                                triggerCollapseAllEl.indeterminate = true;
                            }
                        }
                        activableRowList.forEach(closingRowEl => {
                            const targetIndex = activeRowElArray.findIndex(activeRowEl => activeRowEl === activableRowList[index]);
                            activeRowElArray[targetIndex].classList.remove("table-active");
                            delete activeRowElArray[targetIndex];
                        });
                    }
                    collapseList[index].toggle();
                }));

        triggerCollapseAllElList.forEach(
            (triggerEl, i) => triggerEl.addEventListener(
                "change",
                (event) => {
                    const table = event.target.closest('table');
                    const targetTriggerCollapseElList = table.querySelectorAll('.trigger-collapse');
                    if (event.target.checked) {
                        targetTriggerCollapseElList.forEach((targetTriggerCollapseEl) => {
                            if (!targetTriggerCollapseEl.checked) {
                                targetTriggerCollapseEl.checked = true;
                                targetTriggerCollapseEl.dispatchEvent(new Event("change"));
                            }
                        });
                    } else {
                        targetTriggerCollapseElList.forEach((targetTriggerCollapseEl) => {
                            targetTriggerCollapseEl.checked = false;
                            targetTriggerCollapseEl.dispatchEvent(new Event("change"));
                        });
                    }
                }));
    </script>
</body>

</html>

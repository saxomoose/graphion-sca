<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Closings'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=1)}"></aside>
                <main class="col-md-9">
                    <nav class="d-flex flex-row-reverse">
                        <a data-th-href="@{/closings/create}"><img data-th-src="@{/svg/plus-circle.svg}" width="20"
                                height="20"></a>
                    </nav>
                    <!-- Table -->
                    <table class="table table-hover" id="closingTable">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Name</th>
                                <th scope="col">Closing timestamp</th>
                                <th scope="col">Location</th>
                            </tr>
                        </thead>
                        <tbody>
                            <th-block data-th-each="closing,closingIterStat : ${closingPage}">
                                <tr class="trigger-modal table-secondary" data-th-id="${closing.id()}" role="button">
                                    <th data-th-text="${closingPage.getNumber() * 10 + closingIterStat.getIndex() + 1}"
                                        scope="row">
                                    </th>
                                    <td data-th-text="${closing.name()}"></td>
                                    <td
                                        data-th-text="${#temporals.format(closing.zonedTimestamp(), 'dd/MM/yyyy HH:mm XXX')}">
                                    </td>
                                    <td data-th-text="${closing.location()}"></td>
                                </tr>
                                <th-block data-th-each="user,userIterStat : ${closing.users()}">
                                    <tr class="trigger-modal" role="button">
                                        <td><img class="ms-2" data-th-src="@{/svg/person-vcard.svg}" width="20"
                                                height="20">
                                        </td>
                                        <td data-th-text="${user.firstName()}"></td>
                                        <td data-th-text="${user.lastName()}"></td>
                                        <td data-th-text="${user.username()}"></td>
                                    </tr>
                                    <th-block data-th-each="document,documentIterStat : ${user.documents()}">
                                        <tr class="trigger-modal" role="button">
                                            <td><img class="ms-4" data-th-src="@{/svg/files.svg}" width="20"
                                                    height="20">
                                            </td>
                                            <td data-th-text="${document.filename()}">
                                            </td>
                                            <td data-th-text="${#dates.format(document.signatureTimestamp(), 'yyyy-MM-dd HH:mm:ss')} ?: 'Not signed'"
                                                colspan="2">
                                            </td>
                                        </tr>
                                    </th-block>
                                </th-block>
                            </th-block>
                        </tbody>
                    </table>
                    <nav data-th-replace="~{fragments/pagination :: frag(route = 'closings', page = ${closingPage})}">
                    </nav>
                    <!-- Modals -->
                    <th-block data-th-each="closing,closingIterStat : ${closingPage}">
                        <div class="modal fade" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-body d-flex align-items-center">
                                        <a class="btn btn-primary me-2">Send invites</a>
                                        <a class="btn btn-primary me-2">Edit</a>
                                        <a class="btn btn-danger me-2">Delete</a>
                                        <button class="ms-auto btn-close" data-bs-dismiss="modal"
                                            type="button"></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <th-block data-th-each="user,userIterStat : ${closing.users()}">
                            <div class="modal fade" tabindex="-1">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-body d-flex align-items-center">
                                            <a class="btn btn-primary" data-th-href="@{/users}">View</a>
                                            <button class="ms-auto btn-close" data-bs-dismiss="modal"
                                                type="button"></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <th-block data-th-each="document,documentIterStat : ${user.documents()}">
                                <div class="modal fade" tabindex="-1">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-body d-flex align-items-center">
                                                <a class="btn btn-primary" data-th-href="@{/documents}">View</a>
                                                <button class="ms-auto btn-close" data-bs-dismiss="modal"
                                                    type="button"></button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </th-block>
                        </th-block>
                    </th-block>
                </main>
            </div>
        </div>
    </div>

    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>

    <script type="text/javascript">
        const closingHeader = document.getElementById("closingHeader");
        const userHeader = document.getElementById("userHeader");
        const documentHeader = document.getElementById("documentHeader");

        const tableRowElList = document.querySelectorAll(".table-row");
        if (tableRowElList !== 0) {
            tableRowElList.forEach(
                (tableRowEl, index) => tableRowEl.addEventListener(
                    "click",
                    () => {
                        if (tableRowEl.classList.contains("closing-row")) {
                            // Swap to closingHeader
                            closingHeader.classList.remove("d-none");
                            userHeader.classList.add("d-none");
                            documentHeader.classList.add("d-none");
                        } else if (tableRowEl.classList.contains("user-row")) {
                            closingHeader.classList.add("d-none");
                            userHeader.classList.remove("d-none");
                            documentHeader.classList.add("d-none");
                        } else if (tableRowEl.classList.contains("document-row")) {
                            closingHeader.classList.add("d-none");
                            userHeader.classList.add("d-none");
                            documentHeader.classList.remove("d-none");
                        }
                    }));
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en" class="h-100">
<head data-th-replace="~{fragments/head :: setTitle(~{::title})}">
    <title>Register</title>
</head>
<body class="d-flex flex-column h-100">
<header data-th-replace="~{fragments/header}"></header>
<div class="position-relative">
        <div class="toast-container top-0 end-0 p-3">
            <th-block data-th-each="validationError :${validationErrors}">
                <div data-th-id="${validationError.field} + 'Toast'" class="toast" role="alert">
                    <div class="toast-header">
                        <strong data-th-text="#{${validationError.toast.header}}" class="me-auto"></strong>
                        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                    </div>
                    <div class="toast-body">
                        <p data-th-text="#{${validationError.toast.body}}"></p>
                    </div>
                </div>
            </th-block>
        </div>
</div>
<div class="flex-shrink-0 mt-auto">
    <div class="container-fluid">
        <div class="row d-flex justify-content-center align-items-center">
            <div class="col-md-4">
                <form data-th-action="@{/register}" data-th-object="${user}" method="post" >
                    <div class="mb-3">
<!--                        <label data-th-if="${#fields.hasErrors('username')}" data-th-errors="*{username}" class="alert alert-danger"></label>-->
                        <label data-th-for="username" class="form-label">Email address</label>
                        <input data-th-field="*{username}" type="email" class="form-control">
                    </div>
                    <div class="mb-3">
<!--                        <label data-th-if="${#fields.hasErrors('password')}" data-th-errors="*{password}" class="alert alert-danger"></label>-->
                        <label data-th-for="password" class="form-label">Password</label>
                        <input data-th-field="*{password}" type="password" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>
<footer data-th-replace="~{fragments/footer}"></footer>
<footer data-th-replace="~{fragments/scripts}"></footer>
<script type="module">
    import { Toast } from "bootstrap";
    const toastElList = document.querySelectorAll(".toast");
    if (toastElList.length !== 0) {
        const toastList = [...toastElList].map(
            toastEl => new Toast(toastEl)
        );
        toastList.forEach(toast => toast.show());
        console.log(toastList);
    }
</script>
</body>
</html>

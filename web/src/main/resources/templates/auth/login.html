<!DOCTYPE html>
<html lang="en" class="h-100">

<head data-th-replace="~{fragments/head :: frag(~{title = 'Login'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0 mt-auto">
        <div class="container-fluid">
            <div class="row d-flex justify-content-center align-items-center">
                <div class="col-md-4">
                    <form data-th-action="@{/login}" data-th-object="${user}" method="post">
                        <input type="hidden" data-th-name="${_csrf.parameterName}" data-th-value="${_csrf.token}" />
                        <div class="mb-3">
                            <label for="username" class="form-label">Email address</label>
                            <input id="username" name="username" type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <script data-th-replace="~{fragments/toast-script}"></script>
</body>

</html>

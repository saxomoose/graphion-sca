<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/web/head :: frag(~{title = 'Create document'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/web/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/web/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/web/sidebar :: frag(activeNavLink = 2)}"></aside>
                <main class="col-md-10">
                    <div class="row">
                        <div class="col-md-4">
                            <form id="upload-form" data-th-action="@{/users/{method}(method = 'dob')}" method="post">
                                <div class="mb-3">
                                    <label class="form-label" for="first-name">First name</label>
                                    <input class="form-control" id="first-name" name="firstName" type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="last-name">Last name</label>
                                    <input class="form-control" id="last-name" name="lastName" type="text" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="email">Email</label>
                                    <input class="form-control" id="email" name="email" type="email" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="date-of-birth">Date of birth</label>
                                    <input class="form-control" id="date-of-birth" name="dateOfBirth" type="date">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Role</label>
                                    <select class="form-select">
                                        <option value="ROLE_SIGNATORY" selected>Signatory</option>
                                        <option value="ROLE_USER">User</option>
                                    </select>
                                </div>
                                <button class="btn btn-primary" type="submit">Save</button>
                        </div>
                        </form>
                    </div>
            </div>
            </main>
        </div>
    </div>
    </div>
    <footer data-th-replace="~{fragments/web/footer}"></footer>
    <script data-th-replace="~{fragments/web/bootstrap-script}"></script>
    <script data-th-replace="~{fragments/web/toast-script}"></script>
</body>

</html>

<!DOCTYPE html>
<html class="h-100" lang="en">

<head data-th-replace="~{fragments/head :: frag(~{title = 'users'})}"></head>

<body class="d-flex flex-column h-100">
    <header data-th-replace="~{fragments/header}"></header>
    <div data-th-replace="${notifications} ? ~{fragments/notifications :: frag(${notifications})} : _"></div>
    <div class="flex-shrink-0">
        <div class="container-fluid">
            <div class="row mt-3">
                <aside data-th-replace="~{fragments/sidebar :: frag(activeNavLink=2)}"></aside>
                <main class="col-md-10">
                    <nav class="d-flex flex-row-reverse">
                        <a data-th-href="@{/users/create}"><img data-th-src="@{/svg/plus-circle.svg}" width="20"
                                height="20"></a>
                    </nav>
                    <!-- Table -->
                    <table class="table table-hover" id="user-table">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Last name</th>
                                <th scope="col">First name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Electronic signature consent</th>
                                <th scope="col"></th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <th-block data-th-each="user,userIterStat : ${userPage}">
                                <tr data-th-id="${user.id()}">
                                    <th scope="row"
                                        data-th-text="${userPage.getNumber() * 10 + userIterStat.getIndex() + 1}">
                                    </th>
                                    <td data-th-text=" ${user.lastName()}">
                                    </td>
                                    <td data-th-text="${user.firstName()}"></td>
                                    <td data-th-text="${user.email()}"></td>
                                    <td data-th-text="${user.electronicSignatureConsent()}"></td>
                                    <td class="text-end"><img class="trigger-modal" data-th-src="@{/svg/three-dots.svg}"
                                            role="button" width="20" height="20"></td>
                                </tr>
                            </th-block>
                        </tbody>
                    </table>
                    <nav data-th-replace="~{fragments/pagination :: frag(route = 'users', page = ${userPage})}">
                    </nav>
                    <!-- Modal -->
                    <div class="modal fade" data-th-each="user: ${userPage}" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-body d-flex align-items-center">
                                    <a class="btn btn-primary me-2">Edit</a>
                                    <a class="btn btn-danger me-2">Delete</a>
                                    <button class="ms-auto btn-close" data-bs-dismiss="modal" type="button"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <footer data-th-replace="~{fragments/footer}"></footer>
    <script data-th-replace="~{fragments/scripts}"></script>
    <div data-th-replace="~{fragments/toast-script}"></div>
    <div data-th-replace="~{fragments/modal-script}"></div>
</body>

</html>

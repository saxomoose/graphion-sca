[versions]

[libraries]
digidoc4j = { module = "org.digidoc4j:digidoc4j", version = "latest.release" }
flywaycore = { module = "org.flywaydb:flyway-core", version = "latest.release" }
jaxbcore = { module = "com.sun.xml.bind:jaxb-core", version = "2.3.0.1" } 
minio = { module = "io.minio:minio", version = "latest.release" }
webeid = { module = "org.webeid.security:authtoken-validation", version = "latest.release" }

[plugins]
flyway = { id = "org.flywaydb.flyway", version = "latest.release" }
node = { id = "com.github.node-gradle.node", version = "latest.release" }
springboot = { id = "org.springframework.boot", version = "latest.release" }
springdependencymanagement = { id = "io.spring.dependency-management", version = "latest.release" }
